# The build of every arm, so that a green pull request means the apps still build (B-22).
#
# It runs scripts/build-arms.sh - the same script a contributor runs - and the shared module's tests.
# The script refuses any Xcode but the pinned build (BRIEF.md, pins), so the first step looks for
# that build among the runner's Xcodes and fails, saying so, when the image does not carry it:
# a red job on a missing toolchain is the honest state, a green one on another toolchain is not.
# CI never measures anything; it only builds, unsigned, for the simulator.
#
# It runs only when something it builds changed (owner, 2026-10-10): a change to the documents alone
# runs the `check` workflow and not this one, whose macOS job takes a quarter of an hour. The list is
# everything the build reads; a new top-level input has to be added here, or it will not trigger the
# build that depends on it.
name: apps

on:
  push:
    paths:
      - "apps/**"
      - "shared/**"
      - "bridge-*/**"
      - "compose-ui/**"
      - "harness/**"
      - "fixtures/**"
      - "scripts/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/apps.yaml"
  pull_request:
    paths:
      - "apps/**"
      - "shared/**"
      - "bridge-*/**"
      - "compose-ui/**"
      - "harness/**"
      - "fixtures/**"
      - "scripts/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/apps.yaml"
  workflow_dispatch:

jobs:
  build:
    # GitHub's image with Xcode 27 (a preview label on 2026-10-10, actions/runner-images#14404).
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select the pinned Xcode
        run: |
          pinned=$(sed -n 's/^PINNED_XCODE_BUILD=//p' scripts/build-arms.sh)
          for app in /Applications/Xcode*.app; do
            build=$(/usr/libexec/PlistBuddy -c 'Print :ProductBuildVersion' "$app/Contents/version.plist" 2>/dev/null || true)
            echo "$app: $build"
            if [ "$build" = "$pinned" ]; then
              sudo xcode-select -s "$app/Contents/Developer"
              xcodebuild -version
              exit 0
            fi
          done
          echo "::error::no Xcode with build $pinned on this runner image"
          exit 1

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # The Kotlin/Native toolchain and its dependencies, about a gigabyte, keyed on the versions.
      - uses: actions/cache@v4
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}

      - name: Shared module tests
        run: ./gradlew --console=plain :shared:allTests

      # Arm A's Swift filter against the same vector the Kotlin test reads (B-07).
      - name: Arm A's filter against the test vector
        run: scripts/check-filter-vectors.sh

      - name: Build every arm
        run: scripts/build-arms.sh

      # The UI tests that drive the scenarios (B-13): compiled, not run - running them needs the
      # arms installed and is the harness's business on a simulator or a device.
      - name: Build the harness
        run: |
          xcodebuild build-for-testing -project harness/Harness.xcodeproj -scheme HarnessUITests \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build/DerivedData/harness \
            CODE_SIGNING_ALLOWED=NO > build/DerivedData/harness.log 2>&1 || { tail -30 build/DerivedData/harness.log; exit 1; }

      - name: Build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: build/DerivedData/*.log
